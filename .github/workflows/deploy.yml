name: manifest.json + Deploy Pages

on:
  push:
    branches:
      - gh-pages  # Update if default branch is changed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 1. Generate the manifest locally on the runner
      - name: Generate manifest.json locally
        run: node genManifest.js

      # 2. Configure GitHub Pages environment explicitly
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove PDFs to reduce artifact size
        run: rm -rf 'Colored-Cover-Stories/PDFs'

      # 3. Package the entire directory (including the freshly generated manifest)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      # 4. Deploy the artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4