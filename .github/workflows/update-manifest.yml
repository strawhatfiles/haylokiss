name: Generate manifest.json + pages

on:
  push:
    branches:
      - gh-pages  # Change to 'master' if that is your default branch name

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate manifest.json
        run: node genManifest.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update image manifest.json"
          file_pattern: manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove PDFs to reduce artifact size
        run: rm -rf 'Colored-Cover-Stories/PDFs'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the entire repository root, minus the PDFs.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4